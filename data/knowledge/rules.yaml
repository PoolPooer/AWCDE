- rule_id: kb-hardware-001
  version: "1.0.0"
  description: Hardware-specialized workloads need specific accelerator types
  conditions:
    - field: classification.primary_category
      operator: eq
      value: hardware_specialized
  recommendations:
    model_family: hardware-optimized
    runtime: vllm-hardware-tuned
    hardware_suitability: dedicated-accelerator
    deployment_topology: pinned-node-affinity
    scheduling_policy: hardware-affinity
  rationale_template: >
    Workload classified as {classification.primary_category} with hardware
    affinity score {signature.hardware_affinity.score}. Rule {rule_id}
    recommends dedicated accelerator configuration.

- rule_id: kb-general-001
  version: "1.0.0"
  description: General-purpose workloads use balanced configuration
  conditions:
    - field: classification.primary_category
      operator: eq
      value: general_purpose
  recommendations:
    model_family: general-purpose
    runtime: vllm-standard
    hardware_suitability: gpu-shared-pool
    deployment_topology: multi-replica-balanced
    scheduling_policy: fair-share
  rationale_template: >
    Workload classified as {classification.primary_category} with no single
    dominant dimension. Rule {rule_id} recommends balanced general-purpose
    configuration.
