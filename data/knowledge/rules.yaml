- rule_id: kb-latency-001
  version: "1.0.0"
  description: Latency-critical workloads need low-latency runtime and real-time scheduling
  conditions:
    - field: classification.primary_category
      operator: eq
      value: latency_critical
  recommendations:
    model_family: latency-optimized-small
    runtime: vllm-low-latency
    hardware_suitability: gpu-dedicated-single
    deployment_topology: single-node-dedicated
    scheduling_policy: real-time-priority
  rationale_template: >
    Workload classified as {classification.primary_category} with latency
    sensitivity score {signature.latency_sensitivity.score}. Rule {rule_id}
    recommends low-latency runtime configuration.

- rule_id: kb-latency-002
  version: "1.0.0"
  description: High latency sensitivity with high concurrency needs distributed low-latency
  conditions:
    - field: signature.latency_sensitivity.score
      operator: gte
      value: 0.7
    - field: signature.concurrency_profile.score
      operator: gte
      value: 0.5
  recommendations:
    model_family: latency-optimized-distributed
    runtime: vllm-low-latency-distributed
    hardware_suitability: gpu-cluster-low-latency
    deployment_topology: multi-node-low-latency
    scheduling_policy: real-time-distributed
  rationale_template: >
    High latency sensitivity ({signature.latency_sensitivity.score}) combined with
    significant concurrency ({signature.concurrency_profile.score}). Rule {rule_id}
    recommends distributed low-latency configuration.

- rule_id: kb-throughput-001
  version: "1.0.0"
  description: Throughput-optimized workloads benefit from batching and horizontal scale
  conditions:
    - field: classification.primary_category
      operator: eq
      value: throughput_optimized
  recommendations:
    model_family: throughput-optimized-large
    runtime: vllm-batched
    hardware_suitability: gpu-multi-instance
    deployment_topology: multi-replica-balanced
    scheduling_policy: batch-queue
  rationale_template: >
    Workload classified as {classification.primary_category} with throughput
    orientation score {signature.throughput_orientation.score}. Rule {rule_id}
    recommends batched processing configuration.

