[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awcde"
version = "0.1.0"
description = "Adaptive Workload Characterization and Deployment Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100",
    "coverage[toml]>=7.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_steps.py"]
markers = [
    "unit: TDD unit tests (tier 1)",
    "bdd: BDD behavioral tests (tier 2)",
    "integration: API integration tests (tier 3)",
    "contract: Schema contract tests (tier 4)",
    "fuzz: Property-based fuzz tests (tier 5)",
]

[tool.coverage.run]
source = ["src/awcde"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/awcde"]
